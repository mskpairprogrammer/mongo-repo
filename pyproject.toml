[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voyageai-semantic-search"
version = "0.1.0"
description = "A small Python project for semantic search and reranking with Voyage AI and Groq."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "voyageai>=0.3.0",
  "groq>=0.31.0",
  "python-dotenv>=1.0.1",
]

[project.scripts]
voyage-demo = "voyageai_project.cli:main"

[project.optional-dependencies]
dev = ["ruff>=0.6.0"]

[tool.setuptools]
packages = ["voyageai_project"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
